<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderBuddy — HeyGen SDK Test</title>
  <link rel="stylesheet" href="index.css" />
  <!-- ESM loader: import the SDK module locally or from CDN -->
  <script>
    (function(){
      async function ensureHeyGen(){
        try {
          if (window.HeyGen && window.HeyGen.StreamingAvatar) return window.HeyGen; // if a global exists
          // Prefer bundled CDN that resolves deps in-browser
          return await import('https://esm.sh/@heygen/streaming-avatar@2?bundle');
        } catch (e1) {
          try {
            // Local ESM (requires dependencies resolvable by the browser)
            return await import('/node_modules/@heygen/streaming-avatar/lib/index.esm.js');
          } catch (e2) {
            try {
              // unpkg with ESM
              return await import('https://unpkg.com/@heygen/streaming-avatar@2/lib/index.esm.js');
            } catch (e3) {
              alert('HeyGen SDK not loaded');
              throw e3;
            }
          }
        }
      }
      window.__ensureHeyGen = ensureHeyGen;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <h1>OrderBuddy — HeyGen SDK Test</h1>
  </header>

  <main class="container">
    <section class="left">
      <div class="videoWrap">
        <video id="mediaElement" autoplay playsinline></video>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div id="autoplayHint" class="hint hide">Click anywhere to enable audio…</div>
    </section>

    <section class="right">
      <h2>SDK Controls</h2>
      <div class="form">
        <label>
          Token / API Key (for quick local testing)
          <input id="token" type="password" placeholder="Enter Trial Token or API Key" />
        </label>
        <label>
          Avatar (name or id)
          <input id="avatar" type="text" placeholder="Pedro_CasualLook_public or avtr_…" />
        </label>
        <label>
          Voice ID
          <input id="voice" type="text" placeholder="48bf398e…" />
        </label>
        <label>
          Quality
          <select id="quality">
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </label>
        <div style="margin-top:8px">
          <button id="connectBtn">Connect</button>
          <button id="disconnectBtn" disabled>Disconnect</button>
        </div>
      </div>

      <div class="form" style="margin-top:16px">
        <label>
          Say
          <input id="sayText" type="text" placeholder="Type something for the avatar" />
        </label>
        <div style="margin-top:8px">
          <button id="sayBtn" disabled>Send</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <small>SDK test page. Use a Trial Token for local dev.</small>
  </footer>

  <script>
  (function(){
    const statusEl = document.getElementById('status');
    const media = document.getElementById('mediaElement');
    const autoplayHint = document.getElementById('autoplayHint');
    const tokenEl = document.getElementById('token');
    const avatarEl = document.getElementById('avatar');
    const voiceEl = document.getElementById('voice');
    const qualityEl = document.getElementById('quality');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sayText = document.getElementById('sayText');
    const sayBtn = document.getElementById('sayBtn');

    let client = null;
    let session = null;
    let lastReq = null; // remember last createStartAvatar payload
    let hbTimer = null; // keep-alive timer

    function startHeartbeat(){
      stopHeartbeat();
      hbTimer = setInterval(async ()=>{
        try { if (client && session) await client.keepAlive(); } catch {}
      }, 20000);
    }
    function stopHeartbeat(){ if (hbTimer) { clearInterval(hbTimer); hbTimer = null; } }

    function log(m){ statusEl.innerHTML += String(m) + '<br>'; statusEl.scrollTop = statusEl.scrollHeight; }
    function isUUIDLike(str){ return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(str) || /^avtr_/.test(str); }

    async function loadDefaults(){
      try{
        const cfg = await fetch('/config', { cache: 'no-store' }).then(r=>r.json());
        if (cfg.HEYGEN_AVATAR) avatarEl.value = cfg.HEYGEN_AVATAR;
        if (cfg.HEYGEN_VOICE) voiceEl.value = cfg.HEYGEN_VOICE;
        // Default to medium for better attach reliability
        qualityEl.value = (cfg.HEYGEN_QUALITY || 'medium');
        // Attempt to fetch a dev token from the server to avoid pasting keys
        try {
          const tk = await fetch('/heyg/token', { cache: 'no-store' }).then(r=>r.ok?r.json():Promise.reject());
          if (tk && tk.token) tokenEl.value = tk.token;
        } catch {}
      } catch(e){ /* ignore */ }
    }

    async function pickInteractiveAvatarId(){
      try{
        const res = await fetch('/heyg/avatars', { cache: 'no-store' });
        const j = await res.json();
        const list = Array.isArray(j?.data) ? j.data : [];
        const pick = list.find(a => a && (a.is_interactive || a.isInteractive));
        return pick ? pick.avatar_id : '';
      }catch{ return ''; }
    }

    async function connect(){
      try{
        const apiKey = (tokenEl.value||'').trim();
        if (!apiKey) { alert('Please enter a Trial Token or API Key.'); return; }

        const cfg = await fetch('/config', { cache: 'no-store' }).then(r=>r.json());
        const mod = await window.__ensureHeyGen();
        const StreamingAvatar = (mod && (mod.default || mod.StreamingAvatar)) || null;
        if (!StreamingAvatar) { alert('HeyGen SDK not loaded'); return; }

        client = new StreamingAvatar({ token: apiKey, basePath: cfg.HEYGEN_SERVER_URL || 'https://api.heygen.com' });

        let avatar = (avatarEl.value||'').trim();
        const voiceId = (voiceEl.value||'').trim();
        let quality = (qualityEl.value||'medium');
        const req = { quality, voice: { voiceId }, disableIdleTimeout: true };
        if (!avatar) {
          const picked = await pickInteractiveAvatarId();
          if (picked) { avatar = picked; avatarEl.value = picked; }
        }
        if (avatar) { if (isUUIDLike(avatar)) req.avatarId = avatar; else req.avatarName = avatar; }

        log('Creating + starting session via SDK…');
        lastReq = req;
        session = await client.createStartAvatar(req);
        startHeartbeat();

        // Attach stream when ready and ensure playback
        client.on('stream_ready', (ev)=>{
          const stream = ev.detail;
          if (stream) {
            media.srcObject = stream;
            media.play().catch(()=>{
              autoplayHint.classList.remove('hide');
              const once = () => { media.play().catch(()=>{}); autoplayHint.classList.add('hide'); document.removeEventListener('click', once, true); };
              document.addEventListener('click', once, true);
            });
          }
        });

        // If we don’t see a stream within 7s, retry once on medium
        let retried = false;
        setTimeout(async ()=>{
          if (!media.srcObject && !retried) {
            retried = true;
            try{
              log('No media yet — retrying on quality=medium');
              try { await client.stopAvatar(); } catch {}
              const req2 = { ...lastReq, quality: 'medium' };
              lastReq = req2;
              session = await client.createStartAvatar(req2);
            }catch(e){ log('Retry failed: ' + (e.message||e)); }
          }
        }, 7000);
        media.muted = false;
        media.play().catch(()=>{
          autoplayHint.classList.remove('hide');
          const once = () => { media.play().catch(()=>{}); autoplayHint.classList.add('hide'); document.removeEventListener('click', once, true); };
          document.addEventListener('click', once, true);
        });

        sayBtn.disabled = false;
        disconnectBtn.disabled = false;
        connectBtn.disabled = true;
        log('Connected via SDK.');

        client.on && client.on('connection_quality_changed', (ev)=>{ const d = ev?.detail; log('SDK quality: ' + (typeof d==='string'?d:JSON.stringify(d||{}))); });
        client.on && client.on('stream_disconnected', async (ev)=>{
          log('Stream disconnected: ' + (ev.detail||''));
          // Try to seamlessly re-establish the session using last request
          try {
            stopHeartbeat();
            try { await client.stopAvatar(); } catch {}
            session = await client.createStartAvatar(lastReq || {});
            startHeartbeat();
            log('Session re-established after disconnect.');
          } catch (e) {
            log('Auto-reconnect failed: ' + (e.message||e));
          }
        });
        client.on && client.on('avatar_start_talking', ()=>{ log('Avatar started talking'); });
        client.on && client.on('avatar_end_message', ()=>{ log('Avatar finished sentence'); });
      } catch(e){ log('Connect failed: ' + (e.message||e)); }
    }

    async function disconnect(){
      try {
        sayBtn.disabled = true;
        connectBtn.disabled = false;
        disconnectBtn.disabled = true;
        if (client && session) {
          try { await client.close && client.close({ sessionId: session.sessionId }); } catch {}
        }
        stopHeartbeat();
        session = null;
        client = null;
        media.srcObject = null;
        log('Disconnected.');
      } catch(e){ log('Disconnect failed: ' + (e.message||e)); }
    }

    async function say(){
      const text = (sayText.value||'').trim();
      if (!text) return;
      if (!client || !session) { log('Not connected.'); return; }
      try { await client.speak({ text }); log('Sent text.'); }
      catch(e){
        const status = e?.status || e?.code || 'unknown';
        const resp = e?.responseText || '';
        log('Task failed ('+status+'): ' + (e.message||'') + (resp?(' | '+resp):''));
        const msg = (String(e?.message||'') + ' ' + String(resp||'')).toLowerCase();
        if (String(status)==='400' && (msg.includes('invalid session') || msg.includes('10002') || msg.includes('session is not in correct state'))) {
          try{
            log('Recovering session…');
            try { await client.stopAvatar(); } catch {}
            session = await client.createStartAvatar(lastReq || {});
            await client.speak({ text });
            log('Recovered and sent text.');
          }catch(e2){ log('Recovery failed: ' + (e2.message||e2)); }
        }
      }
    }

    connectBtn.addEventListener('click', connect);
    disconnectBtn.addEventListener('click', disconnect);
    sayBtn.addEventListener('click', say);
    document.addEventListener('DOMContentLoaded', loadDefaults());
  })();
  </script>
</body>
</html>
