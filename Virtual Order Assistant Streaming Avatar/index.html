<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrderBuddy — Virtual Order Assistant</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <header class="topbar">
    <h1>OrderBuddy — Virtual Order Assistant</h1>
  </header>

  <main class="container">
    <section class="left">
      <div class="videoWrap">
        <video id="mediaElement" autoplay playsinline></video>
      </div>
      <div id="status" class="status"></div>
      <div id="autoplayHint" class="hint hide">Click anywhere to enable audio…</div>
    </section>

    <section class="right">
      <h2>Menu</h2>
      <div id="menu"></div>
    </section>
  </main>

  <footer class="footer">
    <small>Avatar connects on page load. Python controls speech via /session/start and /speak.</small>
  </footer>

  <script src="index.js"></script>
</body>
</html>
